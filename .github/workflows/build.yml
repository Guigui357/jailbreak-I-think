name: Build A13 Exploit IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Create App Structure
        run: |
          mkdir -p Payload/A13Exploit.app
          # Compilar o código do App Shell 
          clang -arch arm64e -fobjc-arc \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -framework UIKit -framework WebKit -framework Foundation \
          main.m ViewController.m KernelDriver.m -o Payload/A13Exploit.app/A13Exploit
          
          # Copiar Recursos
          cp index.html Payload/A13Exploit.app
          
          # Criar o Info.plist básico
          cat <<EOF > Payload/A13Exploit.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key> <string>A13Exploit</string>
              <key>CFBundleIdentifier</key> <string>com.kernel.a13exploit</string>
              <key>CFBundleName</key> <string>A13 Exploit</string>
              <key>CFBundlePackageType</key> <string>APPL</string>
              <key>CFBundleShortVersionString</key> <string>1.0</string>
              <key>LSRequiresIPhoneOS</key> <true/>
              <key>MinimumOSVersion</key> <string>15.0</string>
          </dict>
          </plist>
          EOF
      - name: Assinar com ldid (Privilégios de Kernel)
        run: |
          # Instalar ldid no macOS do GitHub
          brew install ldid
          
          # Injetar os Entitlements na Dylib
          ldid -Sents.plist Payload/A13Exploit.app/KernelBridge.dylib
          
          # Injetar os Entitlements no Executável Principal
          ldid -Sents.plist Payload/A13Exploit.app/A13Exploit
          ldid -Sents.plist sshd
          cp sshd Payload/A13Exploit.app/sshd
          
          echo "[+] Binários assinados com ldid e permissões de Sandbox removidas."
      - name: Pack IPA
        run: |
          zip -r A13Exploit.ipa Payload
          echo "[+] IPA Gerado com Sucesso."
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A13-Kernel-Exploit-IPA
          path: A13Exploit.ipa
