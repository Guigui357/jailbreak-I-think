name: Build Catalyst-26 A13 Exploit

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Create App Structure
        run: |
          mkdir -p Payload/QuantumJailbreak.app

          clang -arch arm64 -miphoneos-version-min=14.0 \
          -framework IOKit -framework CoreFoundation -framework Security \
          -framework Foundation -framework XPC -framework UIKit
          -o Payload/QuantumJailbreak.app/quantum_jailbreak ViewController.m

          cp Info.plist Payload/QuantumJailbreak.app/Info.plist
      - name: Assinar com ldid (Bypass Sandbox & Root Privs)
        run: |
          brew install ldid
          # [!] CRÍTICO: Assinar os binários com as entitlements que você postou
          # O arquivo deve se chamar exatamente 'ents.plist' no seu repositório
          if [ -f "ents.plist" ]; then
            ldid -Sents.plist -M Payload/A13Exploit.app/A13Exploit
            echo "[+] Assinatura ldid aplicada com sucesso."
          else
            echo "[!] ERRO: Arquivo ents.plist não encontrado. Usando assinatura simples."
            ldid -S Payload/A13Exploit.app/A13Exploit
          fi
          
          # Garantir bits de execução
          chmod 755 Payload/A13Exploit.app/A13Exploit

      - name: Pack IPA
        run: |
          # O iOS exige que a pasta Payload seja zipada como .ipa
          zip -r A13Exploit.ipa Payload
          echo "[+] IPA Catalyst-26 Gerado."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catalyst-26-A13-IPA
          path: A13Exploit.ipa
