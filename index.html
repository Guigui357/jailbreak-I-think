<!DOCTYPE html>
<html lang="pt">
<head>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        #console { border: 1px solid #0f0; height: 300px; overflow-y: auto; padding: 10px; font-size: 12px; }
        .btn { border: 1px solid #0f0; background: #000; color: #0f0; width: 100%; padding: 15px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>[ KERNEL_LAB_A13 ]</h2>
    <div id="console">> Sistema inicializado.</div>
    <button class="btn" onclick="startScan()">1. QUEBRAR KASLR</button>
    <button class="btn" onclick="gainRoot()" style="color: #f00; border-color: #f00;">2. ESCALONAR PARA ROOT</button>

    <script>
        const log = (m) => { document.getElementById('console').innerHTML += `<br>> ${m}`; };

        async function startScan() {
            log("⏳ Varrendo memória...");
            const res = await window.webkit.messageHandlers.kernel.postMessageWithReply({action: "scan"});
            log(`✅ Kernel Slide: ${res.value}`);
        }

        async function gainRoot() {
            log("☢️ Tentando sobrescrever ucred (PAC/PPL Bypass)...");
            const res = await window.webkit.messageHandlers.kernel.postMessageWithReply({action: "root"});
            if (res.status === "ROOT_SUCCESS") log("🏆 SUCESSO! VOCÊ É ROOT.");
            else log("❌ FALHA: O PPL bloqueou a escrita.");
        }
    </script>
</body>
</html>
