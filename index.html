<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catalyst-26 | A13 Kernel Lab</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #header { font-size: 11px; border-bottom: 1px solid #1a1a1a; padding-bottom: 8px; margin-bottom: 10px; color: #444; display: flex; justify-content: space-between; text-transform: uppercase; }
        #console { flex-grow: 1; overflow-y: auto; background: rgba(0, 5, 0, 0.9); border: 1px solid #111; padding: 12px; font-size: 12px; border-radius: 4px; box-shadow: inset 0 0 20px #000; }
        .line { margin-bottom: 5px; word-break: break-all; border-left: 2px solid transparent; padding-left: 8px; }
        .info { color: #8be9fd; border-left-color: #8be9fd; }
        .success { color: #50fa7b; border-left-color: #50fa7b; font-weight: bold; }
        .error { color: #ff5555; border-left-color: #ff5555; background: rgba(255,0,0,0.1); }
        .warn { color: #f1fa8c; border-left-color: #f1fa8c; }
        .controls { margin-top: 15px; }
        button { width: 100%; background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 18px; font-weight: bold; border-radius: 4px; font-family: inherit; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        button:active { background: #00ff41; color: #000; }
        button:disabled { border-color: #333; color: #333; cursor: wait; opacity: 0.5; }
    </style>
</head>
<body>

    <div id="header">
        <span>[ EXPLOIT: CATALYST-26 ]</span>
        <span>A13 - IPHONE 11</span>
    </div>

    <div id="console">
        <div class="line info">[*] Terminal Catalyst-26 pronto para deploy.</div>
    </div>

    <div class="controls">
        <button id="mainBtn" onclick="runExploit()">EXECUTE PTE BYPASS & ESCALATE ROOT</button>
    </div>

    <script>
        const consoleEl = document.getElementById('console');
        const btn = document.getElementById('mainBtn');

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `line ${type}`;
            div.innerHTML = `> ${msg}`;
            consoleEl.appendChild(div);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        // --- RESPOSTA DO HOST NATIVO ---
        window.receiveKernelResult = function(data) {
            btn.disabled = false;
            btn.innerText = "RE-EXECUTE PTE BYPASS";
            
            try {
                const res = typeof data === 'string' ? JSON.parse(data) : data;
                
                if (res.status === "SUCCESS") {
                    log(`KASLR BYPASS: Slide em ${res.slide}`, "success");
                    log(`PPL BYPASS: PTE writable confirmada.`, "success");

                    if (res.uid === 0) {
                        log(`ROOT ESCALATION: UID 0 (ROOT CONFIRMED)`, "success");
                    } else {
                        log(`ROOT ESCALATION: FALHOU (UID: ${res.uid})`, "error");
                    }

                    if (res.pid > 0) {
                        log(`SPAWN: SSHD disparado (PID: ${res.pid})`, "success");
                        log(`CONEXÃO: ssh root@localhost -p 2222`, "success");
                    } else {
                        log(`SPAWN: FALHA NO SSHD (${res.info})`, "error");
                    }
                } else {
                    log(`FALHA NO EXPLOIT: ${res.info}`, "error");
                    log("Dica: Verifique se o app foi assinado via TrollStore.", "warn");
                }
            } catch (e) {
                log("ERRO AO PROCESSAR RESULTADO: " + e, "error");
            }
        };

        function runExploit() {
            btn.disabled = true;
            btn.innerText = "EXPLORANDO KERNEL..."; 
            log("Disparando trigger nativo via A13_LAB...", "warn");
            log("Aguardando resposta do Host (KASLR Search)...", "info");

            // No iOS real, a ponte correta é window.webkit.messageHandlers
            if (window.webkit && window.webkit.messageHandlers.A13_LAB) {
                window.webkit.messageHandlers.A13_LAB.postMessage({ action: "pte_patch" });
            } else {
                log("ERRO: Handler nativo (WebKit) não detectado.", "error");
                btn.disabled = false;
                btn.innerText = "RE-TENTAR";
            }
        }

        window.onload = () => {
            if(window.webkit && window.webkit.messageHandlers.A13_LAB) {
                log("HOST NATIVO CONECTADO.", "success");
            } else {
                log("ERRO: Ponte WebKit ausente. Execute dentro do App nativo.", "error");
            }
        };
    </script>
</body>
</html>
