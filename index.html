<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catalyst-26 | A13 Kernel Lab</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #header { font-size: 11px; border-bottom: 1px solid #1a1a1a; padding-bottom: 8px; margin-bottom: 10px; color: #444; display: flex; justify-content: space-between; text-transform: uppercase; }
        #console { flex-grow: 1; overflow-y: auto; background: rgba(0, 5, 0, 0.9); border: 1px solid #111; padding: 12px; font-size: 12px; border-radius: 4px; box-shadow: inset 0 0 20px #000; }
        .line { margin-bottom: 5px; word-break: break-all; border-left: 2px solid transparent; padding-left: 8px; }
        .info { color: #8be9fd; border-left-color: #8be9fd; }
        .success { color: #50fa7b; border-left-color: #50fa7b; font-weight: bold; }
        .error { color: #ff5555; border-left-color: #ff5555; background: rgba(255,0,0,0.1); }
        .warn { color: #f1fa8c; border-left-color: #f1fa8c; }
        .controls { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
        input { background: #000; color: #00ff41; border: 1px solid #333; padding: 12px; font-family: inherit; border-radius: 4px; }
        button { background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: wait; }
    </style>
</head>
<body>
    <div id="header"><span>[ EXPLOIT: CATALYST-26 ]</span><span>A13 - IPHONE 11</span></div>
    <div id="console"><div class="line info">[*] Terminal Catalyst-26 pronto para deploy.</div></div>
    
    <div class="controls">
        <button id="mainBtn" onclick="runExploit()">EXECUTE PTE BYPASS & ROOT</button>
        <div style="display:flex; gap:5px;">
            <input type="text" id="cmdInput" placeholder="Comando (ex: id, ls /var/root)" style="flex-grow:1;">
            <button onclick="sendCmd()">RUN</button>
        </div>
    </div>

    <script>
        const consoleEl = document.getElementById('console');
        const btn = document.getElementById('mainBtn');

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `line ${type}`;
            div.innerHTML = `> ${msg}`;
            consoleEl.appendChild(div);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        window.receiveKernelResult = function(res) {
            btn.disabled = false;
            if (res.status === "SUCCESS") {
                log(`KASLR: ${res.slide} | UID: ${res.uid}`, "success");
                if (res.uid === 0) log("ROOT CONFIRMED (UID 0)", "success");
            } else {
                log(`ERRO: ${res.info}`, "error");
            }
        };

        window.receiveCmdOutput = function(output) {
            log(output, "info");
        };

        function runExploit() {
            btn.disabled = true;
            log("Disparando trigger nativo...", "warn");
            window.webkit.messageHandlers.A13_LAB.postMessage({ action: "pte_patch" });
        }

        function sendCmd() {
            const cmd = document.getElementById('cmdInput').value;
            if(!cmd) return;
            log(`exec: ${cmd}`, "warn");
            window.webkit.messageHandlers.A13_LAB.postMessage({ action: "exec_cmd", command: cmd });
            document.getElementById('cmdInput').value = "";
        }
    </script>
</body>
</html>
