<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { background: #000; color: #0f0; font-family: monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; }
        #log-container { flex: 1; border: 1px solid #0f0; overflow-y: scroll; padding: 5px; font-size: 12px; margin-bottom: 10px; background: #050505; }
        .input-line { display: flex; background: #111; border: 1px solid #0f0; padding: 10px; }
        input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 16px; }
        button { background: #0f0; color: #000; border: none; padding: 10px; margin-bottom: 5px; font-weight: bold; width: 32%; }
    </style>
</head>
<body>

    <div style="display: flex; justify-content: space-between;">
        <button onclick="runExploit()">EXPLOIT</button>
        <button onclick="patchAMFI()">AMFI</button>
        <button onclick="setupSSH()">SSH</button>
    </div>

    <div id="log-container">
        [*] [A13] Inicializando Terminal...<br>
    </div>

    <div class="input-line">
        <span style="margin-right:5px">root#</span>
        <input type="text" id="cmd-in" autocomplete="off" spellcheck="false">
    </div>

    <script>
        const logBox = document.getElementById('log-container');
        const cmdInput = document.getElementById('cmd-in');

        // Função global de Log (acessível pelo ViewController via evaluateJavaScript)
        window.log = function(msg, type) {
            const color = type === 'success' ? '#fff' : '#0f0';
            logBox.innerHTML += `<span style="color:${color}">> ${msg}</span><br>`;
            logBox.scrollTop = logBox.scrollHeight;
        };

        function send(action, payload = "", addr = "", val = "") {
            if (window.webkit && window.webkit.messageHandlers.A13_LAB) {
                window.webkit.messageHandlers.A13_LAB.postMessage({
                    action: action, payload: payload, addr: addr, val: val
                });
            } else {
                log("ERRO: Bridge A13_LAB não encontrada!", "err");
            }
        }

        function runExploit() {
            log("Iniciando Cadeia de Exploração A13...", "success");
            log("KASLR Base: 0xfffffff007004000");
            // Se der 0x0 aqui, o KernelDriver.m não retornou a TFP0
            send("kwrite", "", "0xfffffff007004000", "0x0"); 
        }

        function patchAMFI() { log("Aplicando Patch AMFI Real..."); send("shell", "amfi"); }
        function setupSSH() { log("Configurando SSHD..."); send("shell", "sshd"); }

        cmdInput.addEventListener("keyup", (e) => {
            if (e.key === "Enter") {
                const cmd = cmdInput.value;
                if (cmd) {
                    log(`<b style="color:white"># ${cmd}</b>`, 'none');
                    send("shell", cmd);
                    cmdInput.value = "";
                }
            }
        });
    </script>
</body>
</html>
