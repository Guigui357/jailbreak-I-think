<!DOCTYPE html>
<html>
<head>
    <style>body { background: #000; color: #0f4; font-family: monospace; padding: 20px; }</style>
</head>
<body>
    <div id="log">> Aguardando Catalyst-26...</div>
    <button onclick="run()" style="width:100%; padding:20px; background:#000; color:#0f4; border:1px solid #0f4; margin-top:20px;">RUN EXPLOIT</button>

    <script>
        const out = document.getElementById('log');
        const print = (m) => out.innerHTML += "<br>> " + m;

        async function run() {
            // Busca a ponte em todos os escopos injetados
            const bridge = window.kernel || window.webkit?.messageHandlers?.kernel;
            
            if (!bridge || typeof bridge.postMessageWithReply !== 'function') {
                print("ERRO: postMessageWithReply não injetado. Verifique a arquitetura arm64e.");
                return;
            }

            try {
                print("Handshake nativo...");
                const test = await bridge.postMessageWithReply({ action: "test_bridge" });
                print("Status: " + test.info);

                print("Executando Catalyst-26 (PPL Bypass)...");
                const res = await bridge.postMessageWithReply({ action: "pte_patch" });
                print("Kernel Slide: " + res.slide);
                print("ROOT: UID 0 escalado. SSHD disparado.");
            } catch (e) {
                print("CRITICAL: " + e);
            }
        }
    </script>
</body>
</html>
