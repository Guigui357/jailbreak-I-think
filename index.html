<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catalyst-26 | A13 Lab</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #header { font-size: 12px; border-bottom: 1px solid #1a1a1a; padding-bottom: 5px; margin-bottom: 10px; color: #555; display: flex; justify-content: space-between; }
        #console { flex-grow: 1; overflow-y: auto; background: #000; border: 1px solid #111; padding: 10px; font-size: 11px; border-radius: 4px; box-shadow: inset 0 0 10px #001a00; }
        .line { margin-bottom: 4px; word-break: break-all; }
        .info { color: #8be9fd; }
        .success { color: #50fa7b; }
        .error { color: #ff5555; }
        .warn { color: #f1fa8c; }
        .controls { margin-top: 15px; }
        button { width: 100%; background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 15px; font-weight: bold; border-radius: 4px; font-family: inherit; cursor: pointer; }
        button:active { background: #00ff41; color: #000; }
        button:disabled { border-color: #333; color: #333; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="header">
        <span>[ EXPLOIT: CATALYST-26 ]</span>
        <span>iOS 26.4 (A13)</span>
    </div>

    <div id="console">
        <div class="line info">[*] Terminal pronto. Aguardando comando...</div>
    </div>

    <div class="controls">
        <button id="mainBtn" onclick="runExploit()">EXECUTE PTE BYPASS & SPAWN SSHD</button>
    </div>

    <script>
        const consoleEl = document.getElementById('console');
        const btn = document.getElementById('mainBtn');

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `line ${type}`;
            div.innerHTML = `> ${msg}`;
            consoleEl.appendChild(div);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        async function runExploit() {
            btn.disabled = true;
            log("Iniciando Catalyst-26...", "warn");

            // Verifica se a ponte nativa foi injetada corretamente
            const bridge = window.webkit?.messageHandlers?.kernel;

            if (!bridge || typeof bridge.postMessageWithReply !== 'function') {
                log("CRITICAL: Ponte 'kernel' ou 'postMessageWithReply' não encontrada.", "error");
                log("Verifique se usou addScriptMessageHandlerWithReply no ViewController.", "info");
                btn.disabled = false;
                return;
            }

            try {
                log("Estabelecendo handshake nativo...", "info");
                const test = await bridge.postMessageWithReply({ action: "test_bridge" });
                log(`Handshake: ${test.info}`, "success");

                log("Disparando PPL Bypass Race Condition...", "warn");
                const res = await bridge.postMessageWithReply({ action: "pte_patch" });

                if (res.status === "SUCCESS") {
                    log(`KASLR BYPASS: Kernel Slide em ${res.slide}`, "success");
                    log("ESCALADA: Privilégios ROOT obtidos.", "success");
                    log(`SPAWN: SSHD iniciado (PID: ${res.pid || 'N/A'})`, "info");
                    log("Pronto. Conecte via: ssh root@localhost -p 2222", "success");
                } else {
                    log(`FALHA: ${res.info}`, "error");
                }

            } catch (err) {
                log(`PANIC/EXCEPTION: ${err.message || err}`, "error");
                console.error(err);
            } finally {
                btn.disabled = false;
            }
        }

        // Teste de inicialização silencioso
        window.onload = () => {
            if (window.webkit?.messageHandlers?.kernel) {
                log("Conexão com KernelDriver estabelecida.", "success");
            }
        };
    </script>
</body>
</html>
