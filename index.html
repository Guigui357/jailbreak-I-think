<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A13 TERMINAL FIX</title>
    <style>
        /* Ajuste para o teclado não cobrir o input */
        body { 
            background: #000; color: #00ff41; font-family: 'Courier New', monospace; 
            margin: 0; padding: 10px; 
            display: flex; flex-direction: column; 
            height: calc(100% - 20px); position: absolute; top: 0; bottom: 0; left: 0; right: 0;
        }
        #terminal-log { 
            flex: 1; border: 1px solid #00ff41; background: #050505; 
            padding: 10px; overflow-y: auto; font-size: 11px; 
            box-shadow: inset 0 0 15px #00ff4122; margin-bottom: 5px;
            -webkit-overflow-scrolling: touch; /* Scroll suave no iOS */
        }
        .input-box { 
            display: flex; border: 1px solid #00ff41; background: #111; 
            padding: 12px; align-items: center; min-height: 44px;
        }
        #cmd-in { 
            flex: 1; background: transparent; border: none; color: #fff; 
            font-family: monospace; outline: none; font-size: 16px; /* 16px evita o zoom automático no iOS */
        }
        .prompt { font-weight: bold; margin-right: 10px; color: #00ff41; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 5px; }
        button { background: #111; color: #00ff41; border: 1px solid #00ff41; padding: 8px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .success { color: #fff; text-shadow: 0 0 10px #00ff41; }
    </style>
</head>
<body>

    <div class="btn-group">
        <button onclick="runExploit()">Exploit</button>
        <button onclick="patchAMFI()">AMFI</button>
        <button onclick="setupSSH()">SSH</button>
    </div>

    <div id="terminal-log">
        [*] [iP11-A13] CATALYST-26 ONLINE<br>
        <hr style="border:0.5px solid #333;">
    </div>

    <div class="input-box">
        <span class="prompt" id="ps1">root#</span>
        <input type="text" id="cmd-in" autocomplete="off" spellcheck="false" enterkeyhint="go">
    </div>

    <script>
        const logArea = document.getElementById('terminal-log');
        const input = document.getElementById('cmd-in');

        const log = (m, type = 'info') => {
            const s = document.createElement('span');
            if (type === 'success') s.className = 'success';
            s.innerHTML = `> ${m}<br>`;
            logArea.appendChild(s);
            logArea.scrollTop = logArea.scrollHeight;
        };

        // Rola para o final quando o teclado aparece
        input.addEventListener('focus', () => {
            setTimeout(() => { window.scrollTo(0, document.body.scrollHeight); }, 300);
        });

        function sendCommand(action, payload = "", addr = "", val = "") {
            if (window.webkit && window.webkit.messageHandlers.A13_LAB) {
                window.webkit.messageHandlers.A13_LAB.postMessage({
                    action: action, payload: payload, addr: addr.toString(), val: val.toString()
                });
            }
        }

        function runExploit() { log("Iniciando Exploit A13...", "success"); /* ... lógica PAC ... */ }
        function patchAMFI() { log("Patcheando AMFI...", "success"); sendCommand("kwrite", "", "0xfffffff007009a40", "0xD2800000D65F03C0"); }
        function setupSSH() { log("Preparando SSHD...", "info"); sendCommand("shell", "sshd"); }

        input.addEventListener("keyup", (e) => {
            if (e.key === "Enter") {
                const cmd = input.value.trim();
                if (cmd) {
                    log(`<span style="color:#fff"># ${cmd}</span>`, 'none');
                    sendCommand("shell", cmd);
                    input.value = '';
                }
            }
        });
    </script>
</body>
</html>
